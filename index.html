<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPS Pilot</title>
  <style>
    :root {
      --bg: #121824;
      --panel: #1e293b;
      --border: #334155;
      --blue: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --purple: #a855f7;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
    header { background: #0f172a; border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 20; }
    .brand { font-weight: 800; color: var(--blue); font-size: 1rem; }
    .week-box { display: flex; gap: 6px; align-items: center; }
    button, select, input, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 0.85rem; }
    button { cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .tabs { display: flex; background: #0f172a; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; border: none; border-radius: 0; border-bottom: 3px solid transparent; padding: 10px 6px; color: var(--muted); background: transparent; }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); background: #1e293b44; }
    main { max-width: 1100px; margin: 0 auto; padding: 14px; }
    .view { display: none; }
    .view.active { display: block; }
    .row-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 6px 12px; font-size: 0.82rem; cursor: pointer; }
    .chip.active { background: var(--blue); color: #000; border-color: var(--blue); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .card.abs { opacity: 0.5; border-style: dashed; }
    .card.noprat { border-color: var(--purple); }
    .card.shoes { box-shadow: inset 0 0 0 1px var(--amber); }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .score { font-weight: 800; padding: 3px 8px; border-radius: 6px; background: #0f172a; border: 1px solid var(--border); }
    .btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .btn-mini { padding: 6px 4px; font-size: 0.74rem; text-align: center; }
    .on-green { background: #22c55e28; border-color: var(--green); color: #4ade80; }
    .on-purple { background: #a855f730; border-color: var(--purple); color: #e9d5ff; }
    .on-amber { background: #f59e0b30; border-color: var(--amber); color: #fbbf24; }
    .on-red { background: #ef444430; border-color: var(--red); color: #fca5a5; }
    .box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    textarea { width: 100%; min-height: 90px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; background: var(--panel); border-radius: 10px; overflow: hidden; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #0f172a; color: var(--blue); }
  </style>
</head>
<body>
  <header>
    <div class="brand">EPS Pilot</div>
    <div class="week-box">
      <button type="button" id="btn-prev-week">◀</button>
      <select id="week-select"></select>
      <button type="button" id="btn-next-week">▶</button>
    </div>
  </header>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="terrain">Terrain & Notes</button>
    <button type="button" class="tab-btn" data-tab="suivi">Suivi</button>
    <button type="button" class="tab-btn" data-tab="donnees">Données</button>
  </div>

  <main>
    <section id="view-terrain" class="view active">
      <div class="row-bar" id="class-bar"></div>
      <div class="row-bar" id="session-bar"></div>
      <div class="row-bar">
        <button type="button" id="btn-undo" disabled>↩ Annuler</button>
        <button type="button" class="chip active" data-filter="all">Tous</button>
        <button type="button" class="chip" data-filter="present">Présents</button>
        <button type="button" class="chip" data-filter="nopractice">Sans pratique</button>
        <button type="button" class="chip" data-filter="shoes">Oubli chaussures</button>
        <button type="button" class="chip" data-filter="absent">Absents</button>
      </div>
      <div class="grid" id="student-grid"></div>
    </section>

    <section id="view-suivi" class="view">
      <table>
        <thead>
          <tr>
            <th>Élève</th>
            <th>Moy.</th>
            <th>Abs.</th>
            <th>Sans prat.</th>
            <th>Chaussures</th>
            <th>Tenue</th>
          </tr>
        </thead>
        <tbody id="suivi-body"></tbody>
      </table>
    </section>

    <section id="view-donnees" class="view">
      <div class="box">
        <h3 style="margin-bottom:8px; color:var(--blue);">Classe & Importation</h3>
        <div class="row-bar">
          <select id="data-class-select"></select>
          <input type="text" id="new-class-name" placeholder="Nouvelle classe" />
          <button type="button" id="btn-add-class">Créer</button>
        </div>
        <div class="row-bar">
          <input type="text" id="new-session-name" placeholder="Nouveau créneau (ex: Badminton)" />
          <button type="button" id="btn-add-session">Ajouter créneau</button>
        </div>
        <textarea id="bulk-students" placeholder="Un élève par ligne&#10;Kévin M.&#10;Lucas D."></textarea>
        <div class="row-bar" style="margin-top:8px;">
          <button type="button" id="btn-import">Importer la liste</button>
          <button type="button" id="btn-demo">Charger démo</button>
          <button type="button" id="btn-reset">Réinitialiser</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = "eps_pilot_clean_v1";
      var START_MONDAY = new Date(2026, 7, 31);
      var MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

      var state = {
        week: 1,
        className: "3e SEGPA",
        sessionId: "s1",
        filter: "all",
        undo: [],
        data: {
          classes: ["3e SEGPA", "4e3"],
          sessions: {
            "3e SEGPA": [{ id: "s1", label: "Badminton" }],
            "4e3": [{ id: "s1", label: "Rugby" }]
          },
          students: {
            "3e SEGPA": [
              { id: 1, name: "Kévin M." },
              { id: 2, name: "Lucas D." },
              { id: 3, name: "Yanis B." },
              { id: 4, name: "Inès T." }
            ],
            "4e3": [{ id: 5, name: "Mathieu S." }]
          },
          records: {}
        }
      };

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function weekLabel(w) {
        var d1 = new Date(START_MONDAY.getFullYear(), START_MONDAY.getMonth(), START_MONDAY.getDate() + (w - 1) * 7);
        var d2 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate() + 4);
        return "S" + w + " (" + d1.getDate() + " " + MONTHS[d1.getMonth()] + " - " + d2.getDate() + " " + MONTHS[d2.getMonth()] + ")";
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) {}
      }

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.classes) && parsed.classes.length) state.data = parsed;
          }
        } catch (e) {}
      }

      function getRec(studentId) {
        var d = state.data;
        if (!d.records[state.week]) d.records[state.week] = {};
        if (!d.records[state.week][state.className]) d.records[state.week][state.className] = {};
        if (!d.records[state.week][state.className][state.sessionId]) d.records[state.week][state.className][state.sessionId] = {};
        if (!d.records[state.week][state.className][state.sessionId][studentId]) {
          d.records[state.week][state.className][state.sessionId][studentId] = {
            pts: 3, absent: false, noPractice: false, shoes: false, kit: false
          };
        }
        return d.records[state.week][state.className][state.sessionId][studentId];
      }

      function scoreOf(r) {
        if (r.absent) return "ABS";
        var n = r.pts;
        if (r.shoes || r.kit) n = Math.min(n, 2);
        return Math.max(0, Math.min(5, n + 2));
      }

      function pushUndo(studentId) {
        state.undo.push({
          week: state.week,
          className: state.className,
          sessionId: state.sessionId,
          studentId: studentId,
          snap: JSON.parse(JSON.stringify(getRec(studentId)))
        });
        if (state.undo.length > 25) state.undo.shift();
        document.getElementById("btn-undo").disabled = state.undo.length === 0;
      }

      function renderWeeks() {
        var sel = document.getElementById("week-select");
        var html = "";
        for (var w = 1; w <= 42; w++) {
          html += "<option value='" + w + "'" + (w === state.week ? " selected" : "") + ">" + esc(weekLabel(w)) + "</option>";
        }
        sel.innerHTML = html;
      }

      function renderClasses() {
        if (state.data.classes.indexOf(state.className) === -1) state.className = state.data.classes[0];
        var bar = document.getElementById("class-bar");
        bar.innerHTML = state.data.classes.map(function (c) {
          return "<div class='chip" + (c === state.className ? " active" : "") + "' data-cls='" + esc(c) + "'>" + esc(c) + "</div>";
        }).join("");
        bar.querySelectorAll(".chip").forEach(function (el) {
          el.onclick = function () {
            state.className = el.getAttribute("data-cls");
            var ses = state.data.sessions[state.className] || [{ id: "s1", label: "EPS" }];
            state.sessionId = ses[0].id;
            renderAll();
          };
        });
      }

      function renderSessions() {
        var ses = state.data.sessions[state.className] || [{ id: "s1", label: "EPS" }];
        if (!ses.some(function (s) { return s.id === state.sessionId; })) state.sessionId = ses[0].id;
        var bar = document.getElementById("session-bar");
        bar.innerHTML = ses.map(function (s) {
          return "<div class='chip" + (s.id === state.sessionId ? " active" : "") + "' data-sid='" + esc(s.id) + "'>" + esc(s.label) + "</div>";
        }).join("");
        bar.querySelectorAll(".chip").forEach(function (el) {
          el.onclick = function () {
            state.sessionId = el.getAttribute("data-sid");
            renderGrid();
          };
        });
      }

      function renderGrid() {
        var grid = document.getElementById("student-grid");
        var list = (state.data.students[state.className] || []).filter(function (st) {
          var r = getRec(st.id);
          if (state.filter === "present") return !r.absent && !r.noPractice;
          if (state.filter === "nopractice") return !r.absent && r.noPractice;
          if (state.filter === "shoes") return !r.absent && r.shoes;
          if (state.filter === "absent") return r.absent;
          return true;
        });

        if (!list.length) {
          grid.innerHTML = "<p style='color:var(--muted)'>Aucun élève dans ce filtre. Va dans Données pour importer une liste.</p>";
          return;
        }

        grid.innerHTML = list.map(function (st) {
          var r = getRec(st.id);
          var sc = scoreOf(r);
          var cls = "card" + (r.absent ? " abs" : "") + (!r.absent && r.noPractice ? " noprat" : "") + (!r.absent && r.shoes ? " shoes" : "");
          var isPres = !r.absent && !r.noPractice;
          var isNoPrat = !r.absent && r.noPractice;
          return (
            "<div class='" + cls + "' data-id='" + st.id + "'>" +
              "<div class='card-top'><strong>" + esc(st.name) + "</strong><span class='score'>" + (sc === "ABS" ? "ABS" : sc + "/5") + "</span></div>" +
              "<div class='btn-row'>" +
                "<button type='button' class='btn-mini act-pres" + (isPres ? " on-green" : "") + "'>Présent</button>" +
                "<button type='button' class='btn-mini act-noprat" + (isNoPrat ? " on-purple" : "") + "'>Sans pratique</button>" +
                "<button type='button' class='btn-mini act-abs" + (r.absent ? " on-red" : "") + "'>Absent</button>" +
              "</div>" +
              "<div class='btn-row'>" +
                "<button type='button' class='btn-mini act-minus'>- Carton</button>" +
                "<button type='button' class='btn-mini act-plus'>+ Rétablir</button>" +
                "<button type='button' class='btn-mini act-shoes" + (r.shoes ? " on-amber" : "") + "'>👟 Chaussures</button>" +
              "</div>" +
            "</div>"
          );
        }).join("");

        grid.querySelectorAll(".card").forEach(function (card) {
          var id = Number(card.getAttribute("data-id"));
          card.querySelector(".act-pres").onclick = function () { pushUndo(id); var r = getRec(id); r.absent = false; r.noPractice = false; save(); renderGrid(); };
          card.querySelector(".act-noprat").onclick = function () { pushUndo(id); var r = getRec(id); r.absent = false; r.noPractice = true; save(); renderGrid(); };
          card.querySelector(".act-abs").onclick = function () { pushUndo(id); var r = getRec(id); r.absent = true; r.noPractice = false; save(); renderGrid(); };
          card.querySelector(".act-minus").onclick = function () { pushUndo(id); var r = getRec(id); if (!r.absent) r.pts = Math.max(0, r.pts - 1); save(); renderGrid(); };
          card.querySelector(".act-plus").onclick = function () { pushUndo(id); var r = getRec(id); if (!r.absent) r.pts = Math.min(3, r.pts + 1); save(); renderGrid(); };
          card.querySelector(".act-shoes").onclick = function () { pushUndo(id); var r = getRec(id); r.shoes = !r.shoes; save(); renderGrid(); };
        });
      }

      function renderSuivi() {
        var tbody = document.getElementById("suivi-body");
        var list = state.data.students[state.className] || [];
        tbody.innerHTML = list.map(function (st) {
          var sum = 0, cnt = 0, abs = 0, nopr = 0, sh = 0, kt = 0;
          Object.keys(state.data.records).forEach(function (w) {
            var cObj = (state.data.records[w] || {})[state.className] || {};
            Object.keys(cObj).forEach(function (sid) {
              var r = cObj[sid][st.id];
              if (!r) return;
              if (r.absent) abs++;
              else {
                var sc = scoreOf(r);
                if (typeof sc === "number") { sum += sc; cnt++; }
                if (r.noPractice) nopr++;
                if (r.shoes) sh++;
                if (r.kit) kt++;
              }
            });
          });
          return "<tr><td>" + esc(st.name) + "</td><td>" + (cnt ? (sum / cnt).toFixed(1) : "-") + "</td><td>" + abs + "</td><td>" + nopr + "</td><td>" + sh + "</td><td>" + kt + "</td></tr>";
        }).join("");
      }

      function renderDataTab() {
        var sel = document.getElementById("data-class-select");
        sel.innerHTML = state.data.classes.map(function (c) {
          return "<option value='" + esc(c) + "'" + (c === state.className ? " selected" : "") + ">" + esc(c) + "</option>";
        }).join("");
      }

      function renderAll() {
        renderWeeks();
        renderClasses();
        renderSessions();
        renderGrid();
        renderSuivi();
        renderDataTab();
      }

      function init() {
        load();
        var now = new Date();
        var diff = Math.floor((now - START_MONDAY) / 86400000);
        var w = Math.floor(diff / 7) + 1;
        if (w >= 1 && w <= 42) state.week = w;

        document.getElementById("btn-prev-week").onclick = function () { state.week = Math.max(1, state.week - 1); renderAll(); };
        document.getElementById("btn-next-week").onclick = function () { state.week = Math.min(42, state.week + 1); renderAll(); };
        document.getElementById("week-select").onchange = function (e) { state.week = Number(e.target.value) || 1; renderAll(); };

        document.querySelectorAll(".tab-btn").forEach(function (btn) {
          btn.onclick = function () {
            document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
            document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
            btn.classList.add("active");
            document.getElementById("view-" + btn.getAttribute("data-tab")).classList.add("active");
            if (btn.getAttribute("data-tab") === "suivi") renderSuivi();
          };
        });

        document.querySelectorAll("[data-filter]").forEach(function (el) {
          el.onclick = function () {
            document.querySelectorAll("[data-filter]").forEach(function (x) { x.classList.remove("active"); });
            el.classList.add("active");
            state.filter = el.getAttribute("data-filter");
            renderGrid();
          };
        });

        document.getElementById("btn-undo").onclick = function () {
          var last = state.undo.pop();
          document.getElementById("btn-undo").disabled = state.undo.length === 0;
          if (!last) return;
          state.week = last.week;
          state.className = last.className;
          state.sessionId = last.sessionId;
          state.data.records[last.week][last.className][last.sessionId][last.studentId] = last.snap;
          save();
          renderAll();
        };

        document.getElementById("btn-add-class").onclick = function () {
          var inp = document.getElementById("new-class-name");
          var name = inp.value.trim();
          if (!name || state.data.classes.indexOf(name) !== -1) return;
          state.data.classes.push(name);
          state.data.sessions[name] = [{ id: "s1", label: "EPS" }];
          state.data.students[name] = [];
          state.className = name;
          inp.value = "";
          save();
          renderAll();
        };

        document.getElementById("btn-add-session").onclick = function () {
          var cls = document.getElementById("data-class-select").value || state.className;
          var inp = document.getElementById("new-session-name");
          var label = inp.value.trim();
          if (!label) return;
          if (!state.data.sessions[cls]) state.data.sessions[cls] = [];
          state.data.sessions[cls].push({ id: "s_" + Date.now(), label: label });
          inp.value = "";
          save();
          renderAll();
        };

        document.getElementById("btn-import").onclick = function () {
          var cls = document.getElementById("data-class-select").value || state.className;
          var lines = document.getElementById("bulk-students").value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
          if (!lines.length) return;
          if (!state.data.students[cls]) state.data.students[cls] = [];
          lines.forEach(function (name, idx) {
            state.data.students[cls].push({ id: Date.now() + idx, name: name });
          });
          document.getElementById("bulk-students").value = "";
          state.className = cls;
          save();
          renderAll();
        };

        document.getElementById("btn-demo").onclick = function () {
          localStorage.removeItem(STORAGE_KEY);
          state.data.students["3e SEGPA"] = [
            { id: 1, name: "Kévin M." },
            { id: 2, name: "Lucas D." },
            { id: 3, name: "Yanis B." },
            { id: 4, name: "Inès T." }
          ];
          save();
          renderAll();
        };

        document.getElementById("btn-reset").onclick = function () {
          localStorage.removeItem(STORAGE_KEY);
          location.reload();
        };

        renderAll();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
