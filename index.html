<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS Pilot - Gestion Terrain & Suivi</title>
    <style>
        :root {
            --bg-dark: #121824;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        button, .nav-tab, .class-chip, .session-chip, .status-tab, .presence-btn, .toggle-btn, .counter-btn, .dot, .btn-opt, .chip-opt { touch-action: manipulation; cursor: pointer; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

        header { background: #0f172a; padding: 10px 16px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 8px; }
        .logo-title { font-weight: 800; font-size: 1.05rem; color: var(--accent-blue); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        
        .header-controls { display: flex; gap: 6px; align-items: center; }
        .week-nav-btn { background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 0.85rem; }
        .week-nav-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .week-select-dropdown { background: var(--panel-bg); color: var(--accent-blue); border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 0.82rem; max-width: 240px; }

        nav { background: #0f172a; display: flex; border-bottom: 1px solid var(--panel-border); position: sticky; top: 53px; z-index: 99; }
        .nav-tab { flex: 1; padding: 10px 8px; text-align: center; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); border-bottom: 3px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); background: #1e293b40; }

        main { flex: 1; padding: 14px 16px 80px 16px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .class-bar { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
        .class-chip { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 7px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; display: flex; flex-direction: column; align-items: center; }
        .class-chip.active { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }

        .toolbar-terrain { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--panel-bg); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--panel-border); }
        .session-selector-bar { display: flex; gap: 6px; align-items: center; overflow-x: auto; }
        .session-chip { background: #0f172a; border: 1px solid var(--panel-border); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
        .session-chip.active { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }

        .view-mode-toggle { display: flex; gap: 4px; align-items: center; }
        .view-btn { background: #0f172a; border: 1px solid var(--panel-border); color: var(--text-muted); padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .view-btn.active { background: var(--accent-blue); color: black; border-color: var(--accent-blue); }
        .undo-header-btn { background: #f59e0b22; border: 1px solid var(--accent-amber); color: #fbbf24; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        .undo-header-btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: var(--panel-border); color: var(--text-muted); background: #0f172a; }

        .status-filter-bar { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
        .status-tab { background: #0f172a; border: 1px solid var(--panel-border); color: var(--text-muted); padding: 7px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 6px;
