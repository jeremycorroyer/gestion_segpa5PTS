<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS Pilot - Gestion Terrain &amp; Suivi</title>
    <style>
        :root {
            --bg-dark: #121824;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        button, .nav-tab, .class-chip, .session-chip, .status-tab, .presence-btn, .toggle-btn, .counter-btn, .dot, .btn-opt, .chip-opt {
            touch-action: manipulation;
            cursor: pointer;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: #0f172a;
            padding: 10px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 8px;
        }

        .logo-title {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--accent-blue);
            white-space: nowrap;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .week-nav-btn {
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .week-select-dropdown {
            background: var(--panel-bg);
            color: var(--accent-blue);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 600;
            font-size: 0.82rem;
            max-width: 245px;
        }

        nav {
            background: #0f172a;
            display: flex;
            border-bottom: 1px solid var(--panel-border);
            position: sticky;
            top: 53px;
            z-index: 99;
        }

        .nav-tab {
            flex: 1;
            padding: 10px 8px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
        }

        .nav-tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: rgba(30, 41, 59, 0.25);
        }

        main {
            flex: 1;
            padding: 14px 16px 80px 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .class-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .class-chip {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .class-chip.active {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        .toolbar-terrain {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: var(--panel-bg);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .session-selector-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
        }

        .session-chip {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
        }

        .session-chip.active {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        .view-mode-toggle {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .view-btn {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .view-btn.active {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        .undo-header-btn {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--accent-amber);
            color: #fbbf24;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .undo-header-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: var(--panel-border);
            color: var(--text-muted);
            background: #0f172a;
        }

        .status-filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .status-tab {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-tab.active {
            background: #1e293b;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .status-tab .count-pill {
            background: #334155;
            color: var(--text-main);
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .status-tab.active .count-pill {
            background: var(--accent-blue);
            color: #000;
        }

        .status-tab.tab-shoes.active { border-color: var(--accent-amber); color: #fbbf24; }
        .status-tab.tab-shoes.active .count-pill { background: var(--accent-amber); color: #000; }
        .status-tab.tab-nopractice.active { border-color: var(--accent-purple); color: #d8b4fe; }
        .status-tab.tab-nopractice.active .count-pill { background: var(--accent-purple); color: #000; }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 12px;
        }

        .student-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .student-card.is-absent { opacity: 0.45; border-style: dashed; }
        .student-card.is-no-practice { border-color: rgba(168, 85, 247, 0.55); background: linear-gradient(180deg, #271e38 0%, #1e293b 100%); }
        .student-card.has-no-shoes { box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.55); }
        .student-card.group-red { border-left: 6px solid #ef4444; }
        .student-card.group-blue { border-left: 6px solid #38bdf8; }
        .student-card.group-green { border-left: 6px solid #22c55e; }
        .student-card.group-yellow { border-left: 6px solid #eab308; }
        .student-card.group-purple { border-left: 6px solid #a855f7; }

        .student-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .student-identity { display: flex; flex-direction: column; gap: 4px; }
        .student-name { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .alert-badges-row { display: flex; flex-wrap: wrap; gap: 4px; }

        .mini-badge { font-size: 0.68rem; font-weight: 800; padding: 2px 7px; border-radius: 5px; }
        .mini-badge-shoes { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
        .mini-badge-nopractice { background: rgba(168, 85, 247, 0.2); color: #e9d5ff; border: 1px solid #a855f7; }
        .mini-badge-kit { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.55); }

        .color-badge { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .bg-red { background: #ef4444; }
        .bg-blue { background: #38bdf8; }
        .bg-green { background: #22c55e; }
        .bg-yellow { background: #eab308; }
        .bg-purple { background: #a855f7; }
        .bg-none { background: #334155; }

        .group-selector-row {
            display: none;
            gap: 4px;
            justify-content: space-between;
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 6px;
            align-items: center;
        }
        .student-card.show-group-mode .group-selector-row { display: flex; }
        .group-dot-btn { width: 22px; height: 22px; border-radius: 50%; border: none; font-size: 0.7rem; color: white; }

        .student-score { font-size: 1.15rem; font-weight: 900; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
        .score-5 { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .score-4 { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
        .score-3 { background: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid #f97316; }
        .score-low { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .score-absent { background: #334155; color: var(--text-muted); border: 1px solid var(--panel-border); font-size: 0.85rem; }

        .behavior-counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            gap: 6px;
        }
        .behavior-label-wrap { display: flex; flex-direction: column; }
        .behavior-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
        .behavior-sub { font-size: 0.65rem; color: #64748b; }

        .counter-btn { width: 32px; height: 32px; border-radius: 6px; border: none; font-weight: bold; font-size: 1.1rem; }
        .counter-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-minus { background: var(--accent-red); color: white; }
        .btn-restore { background: #334155; color: #e2e8f0; border: 1px solid #475569; font-size: 0.85rem; }
        .btn-plus { background: var(--accent-green); color: white; }

        .counter-dots { display: flex; gap: 6px; align-items: center; }
        .dot { width: 13px; height: 13px; border-radius: 50%; background: #334155; }
        .dot.active-3 { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
        .dot.active-2 { background: var(--accent-orange); box-shadow: 0 0 6px var(--accent-orange); }
        .dot.active-1 { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }
        .bonus-pill { font-size: 0.68rem; font-weight: 800; color: #4ade80; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); padding: 1px 5px; border-radius: 4px; }

        .presence-row { display: grid; grid-template-columns: 1fr 1.25fr 0.85fr; gap: 4px; }
        .presence-btn { padding: 6px 4px; border-radius: 6px; border: 1px solid var(--panel-border); background: #0f172a; color: var(--text-muted); font-size: 0.7rem; text-align: center; font-weight: 700; }
        .presence-btn.present-active { background: rgba(34, 197, 94, 0.15); border-color: var(--accent-green); color: #4ade80; }
        .presence-btn.nopractice-active { background: rgba(168, 85, 247, 0.2); border-color: var(--accent-purple); color: #e9d5ff; }
        .presence-btn.absent-active { background: rgba(100, 116, 139, 0.2); border-color: #94a3b8; color: #e2e8f0; }

        .toggles-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .toggle-btn { padding: 6px 2px; border-radius: 6px; border: 1px solid var(--panel-border); background: #0f172a; color: var(--text-muted); font-size: 0.68rem; text-align: center; font-weight: 700; }
        .toggle-btn.active { background: rgba(239, 68, 68, 0.15); border-color: var(--accent-red); color: #f87171; }
        .toggle-btn.shoes-active { background: rgba(245, 158, 11, 0.2); border-color: var(--accent-amber); color: #fbbf24; }
        .toggle-btn.late-active { background: rgba(249, 115, 22, 0.2); border-color: var(--accent-orange); color: #fb923c; }

        .incident-row { display: flex; gap: 6px; }
        .incident-btn { background: #334155; border: none; color: white; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; flex: 1; }
        .incident-btn.has-incident { background: var(--accent-red); }
        .incident-clear-btn { background: #0f172a; border: 1px solid var(--accent-red); color: #f87171; padding: 6px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; }

        .undo-toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(140%);
            background: #0f172a;
            border: 1px solid var(--accent-amber);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 10px;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            transition: transform 0.25s ease;
        }
        .undo-toast.visible { transform: translateX(-50%) translateY(0); }
        .undo-toast button { background: var(--accent-amber); color: #000; border: none; padding: 5px 10px; border-radius: 6px; font-weight: 800; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; max-width: 500px; width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-red); }

        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip-opt { background: #0f172a; border: 1px solid var(--panel-border); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; }
        .chip-opt.selected { background: var(--accent-red); color: white; border-color: var(--accent-red); }

        .feedback-form { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 1
